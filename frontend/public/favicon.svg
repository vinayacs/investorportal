<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Navy square background -->
  <rect width="100" height="100" rx="12" fill="#0C1D3A"/>

  <!--
    Accurate Texas outline.
    Geographic bounds: lon [-106.65, -93.51], lat [25.84, 36.50]
    x = (lon + 106.65) * 6.85 + 5
    y = (36.50 - lat) * 6.85 + 13.5
    Clockwise from NW panhandle corner.
  -->
  <path fill="#C8972A"
    d="M30,14 L51,14
       L51,27 L55,28 L59,30 L64,30 L68,32 L70,32
       L71,35 L76,34 L79,32 L83,31 L87,34 L88,35 L91,34
       L91,45 L93,58 L94,58
       L88,61 L87,62 L81,65 L78,68 L75,69 L71,72 L68,73
       L70,80 L70,87
       L65,86 L57,83 L51,74 L47,67 L44,62
       L38,60 L33,60 L28,65 L23,63 L19,59
       L17,53 L11,50 L8,47 L5,46
       L30,44
       L30,14 Z"/>

  <!--
    City skyline — white silhouette in lower Texas interior
    (roughly Houston / San Antonio zone, x=60-84 y=46-63)
  -->
  <g fill="white">
    <rect x="60" y="55" width="4" height="8"/>
    <rect x="65" y="50" width="4" height="13"/>
    <rect x="70" y="46" width="5" height="17"/>
    <rect x="71" y="43" width="2" height="4"/>   <!-- antenna -->
    <rect x="76" y="51" width="4" height="12"/>
    <rect x="81" y="56" width="4" height="7"/>
    <rect x="58" y="63" width="29" height="2"/> <!-- ground -->
  </g>

  <!--
    Lone Star — white 5-point star in upper-center Texas (~Brady, TX)
    Center (48, 42), outer r=7, inner r=2.7
  -->
  <polygon fill="white"
    points="48,35 49.6,39.8 54.7,39.8 50.7,42.7 52.2,47.5 48,44.6 43.8,47.5 45.3,42.7 41.3,39.8 46.4,39.8"/>
</svg>
