# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for document management)
    client_max_body_size 55m;

    # index.html — never cache so browsers always fetch latest chunk references after deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Main bundle and styles — content-hashed, safe to cache long-term
    location ~* ^/(main|styles)-[A-Z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Lazy chunks — Angular uses deterministic chunk IDs (not content hashes),
    # so filenames can stay the same across deploys even when content changes.
    # Use no-cache so browsers revalidate via ETag (304 = still fast, always fresh).
    location ~* ^/chunk-[A-Z0-9]+\.js$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Strict rate limit on login — 5 attempts/min per IP, burst of 3
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # General API — 60 requests/min per IP
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Property analysis agent (Python FastAPI) — longer timeout for scraping
    location /api/admin/property-analysis {
        limit_req zone=api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/admin/property-analysis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
