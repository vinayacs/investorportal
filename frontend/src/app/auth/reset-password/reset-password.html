<div class="page-container">
  <div class="card">
    <h1>Set New Password</h1>
    @if (success) {
      <div class="success-msg">Password reset successfully! Redirecting to login...</div>
    } @else {
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" required placeholder="Min 8 characters" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" [(ngModel)]="confirm" name="confirm" required placeholder="Repeat password" />
        </div>
        @if (error) { <div class="error-msg">{{ error }}</div> }
        <button type="submit" [disabled]="loading">{{ loading ? 'Saving...' : 'Reset Password' }}</button>
      </form>
    }
    <a routerLink="/login" class="back-link">Back to Login</a>
  </div>
</div>
